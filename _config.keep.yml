## ======================================================================================
## Hexo Theme Keep 配置文件
## 文档：https://keep-docs.xpoet.cn
## 仓库：https://github.com/XPoet/hexo-theme-keep
## ======================================================================================


# ---------------------------------------------------------------------------------------
# 基础信息
# ---------------------------------------------------------------------------------------
base_info:
  primary_color: "#0066cc"   # 主题主色调
  title: 我的笔记             # 博客标题
  author: ""                 # 作者名
  avatar: ""                 # 头像，可用本地路径或图片链接
  logo: ""                   # 网站 Logo
  favicon: ""                # 网站 favicon


# ---------------------------------------------------------------------------------------
# 导航菜单
# 启用 tags / categories 等页面前，需先执行 `hexo new page tags` 等命令创建对应页面
# 格式：名称: 路径 || 图标（图标可选）
# ---------------------------------------------------------------------------------------
menu:
  home: /                       # || fa-solid fa-home
  archives: /archives           # || fa-solid fa-box-archive
  tags: /tags                   # || fa-solid fa-tags
  categories: /categories       # || fa-solid fa-layer-group
  # links: /links               # || fa-solid fa-link
  # about: /about               # || fa-solid fa-user-graduate


# ---------------------------------------------------------------------------------------
# 首屏（封面）
# ---------------------------------------------------------------------------------------
first_screen:
  enable: false
  background_img: ""       # 浅色模式背景图
  background_img_dark: ""  # 深色模式背景图
  description: ""          # 首屏描述文字，用 || 换行（最多两行）
  hitokoto: false          # 启用后每次进入首页显示随机一言


# ---------------------------------------------------------------------------------------
# 社交链接
# ---------------------------------------------------------------------------------------
social_contact:
  enable: false
  links:
    github:   # GitHub 主页链接
    email:    # 邮箱
    # weixin: # 微信，填图片链接可展示二维码：img | ./images/qrcode.png
    # zhihu:  # 知乎


# ---------------------------------------------------------------------------------------
# 滚动效果
# ---------------------------------------------------------------------------------------
scroll:
  progress_bar: true   # 顶部显示阅读进度条
  percent: false       # 显示百分比
  hide_header: true    # 向下滚动时隐藏顶栏


# ---------------------------------------------------------------------------------------
# 首页
# ---------------------------------------------------------------------------------------
home:
  announcement:              # 首页公告内容，留空则不显示
  category: true             # 首页文章卡片显示分类
  tag: true                  # 首页文章卡片显示标签
  post_datetime: updated     # 首页显示时间类型：updated（更新时间）| created（创建时间）


# ---------------------------------------------------------------------------------------
# 文章
# ---------------------------------------------------------------------------------------
post:
  author_badge:
    enable: false            # 显示作者徽标
    level_badge: true        # true 显示 Lv1/Lv2...；false 显示自定义徽标
    custom_badge: ["笔记"]

  word_count:
    wordcount: false         # 字数统计（需安装 hexo-wordcount）
    min2read: false          # 阅读时长估算

  datetime_format: "YYYY-MM-DD"  # 文章时间格式
  copyright_info: false          # 显示版权信息
  share: false                   # 文章分享按钮

  reward:
    enable: false            # 打赏功能
    img_link: ""             # 收款二维码图片链接
    text: ""                 # 自定义打赏提示文字
    icon: ""                 # 自定义打赏图标


# ---------------------------------------------------------------------------------------
# 代码块
# ---------------------------------------------------------------------------------------
code_block:
  tools:
    enable: true             # 显示代码工具栏（复制、折叠、语言标签）
    style: mac               # 工具栏样式：default | mac
  highlight_theme: obsidian  # 高亮主题：default | obsidian


# ---------------------------------------------------------------------------------------
# 目录（TOC）
# ---------------------------------------------------------------------------------------
toc:
  enable: true       # 启用文章目录
  number: true       # 自动为目录添加编号
  expand_all: false  # true 展开全部目录；false 只展开当前阅读位置
  init_open: true    # 进入文章页时自动展开目录
  layout: right      # 目录位置：left | right


# ---------------------------------------------------------------------------------------
# 网站统计
# ---------------------------------------------------------------------------------------
website_count:
  busuanzi_count:
    enable: false    # 启用不蒜子统计
    site_uv: false   # 显示全站访客数
    site_pv: false   # 显示全站访问量
    page_pv: false   # 显示文章阅读量


# ---------------------------------------------------------------------------------------
# 本地搜索（需安装 hexo-generator-searchdb）
# npm install hexo-generator-searchdb
# ---------------------------------------------------------------------------------------
local_search:
  enable: false
  preload: false     # 页面加载时预加载搜索数据


# ---------------------------------------------------------------------------------------
# 评论系统
# ---------------------------------------------------------------------------------------
comment:
  enable: false
  use: giscus        # 可选：valine | gitalk | twikoo | waline | giscus | artalk | disqus

  giscus:            # 推荐使用 Giscus（基于 GitHub Discussions）
    repo:            # GitHub 仓库，格式：用户名/仓库名
    repo_id:
    category: Announcements
    category_id:
    reactions_enabled: false


# ---------------------------------------------------------------------------------------
# RSS 订阅（需安装 hexo-generator-feed）
# npm install hexo-generator-feed
# ---------------------------------------------------------------------------------------
rss:
  enable: false


# ---------------------------------------------------------------------------------------
# 图片懒加载
# ---------------------------------------------------------------------------------------
lazyload:
  enable: true


# ---------------------------------------------------------------------------------------
# CDN 加速（用于加速主题静态资源）
# ---------------------------------------------------------------------------------------
cdn:
  enable: false
  provider: cdnjs    # 可选：cdnjs | jsdelivr | unpkg


# ---------------------------------------------------------------------------------------
# Pjax（无刷新跳转，提升浏览体验）
# ---------------------------------------------------------------------------------------
pjax:
  enable: false


# ---------------------------------------------------------------------------------------
# 页脚
# ---------------------------------------------------------------------------------------
footer:
  since: 2024        # 建站起始年份
  word_count: false  # 显示全站字数统计

  site_deploy:
    enable: false    # 显示部署平台图标
    provider: github
    url: ""

  record:
    enable: false    # ICP 备案信息（国内服务器需要）
    list:
      - code: ""
        link: ""


# ---------------------------------------------------------------------------------------
# 自定义注入（额外 CSS / JS）
# ---------------------------------------------------------------------------------------
inject:
  enable: false
  css:
    -
  js:
    -
